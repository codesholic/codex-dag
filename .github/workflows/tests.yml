name: Tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  backend:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Backend tests
        run: ./scripts/test.sh
  windows-host:
    runs-on: macos-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: windows/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: npm ci --prefix windows --no-audit --no-fund
      - name: Windows host tests
        run: npm test --prefix windows
        env:
          CODEX_DAG_TEST_PYTHON: python3
